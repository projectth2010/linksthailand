<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oz Thai World | 3D Visualization</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/6.7.0/d3.min.js"></script>
    <script src="https://cdn.socket.io/4.4.1/socket.io.min.js"></script>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <div id="app-container">
        <nav class="navbar">
            <div class="logo-section">
                <h1 id="txt-app-title">Oz Thai World</h1>
            </div>
            <div class="nav-actions">
                <select id="lang-switcher" class="lang-switch">
                    <option value="th">ภาษาไทย (TH)</option>
                    <option value="en" selected>English (EN)</option>
                </select>
                <div class="menu-links">
                    <a href="#" class="nav-link" id="txt-menu-show">Show</a>
                    <a href="#" class="nav-link" id="txt-menu-member">Member</a>
                </div>
            </div>
        </nav>

        <main class="main-content">
            <aside class="sidebar">
                <div class="search-container">
                    <input type="text" id="search-input" class="search-input" placeholder="Search details...">
                </div>
                <div class="node-list-wrapper">
                    <div id="node-list"></div>
                </div>
            </aside>

            <section id="viz-area">
                <svg id="main-svg">
                    <defs>
                        <!-- 3D Sphere Gradients -->
                        <radialGradient id="grad-central" cx="50%" cy="50%" r="50%" fx="25%" fy="25%">
                            <stop offset="0%" style="stop-color:#7dd3fc;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
                        </radialGradient>
                        <radialGradient id="grad-category" cx="50%" cy="50%" r="50%" fx="25%" fy="25%">
                            <stop offset="0%" style="stop-color:#a5b4fc;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#4338ca;stop-opacity:1" />
                        </radialGradient>
                        <!-- Gloss Shadow Filter -->
                        <filter id="gloss-filter" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur" />
                            <feOffset in="blur" dx="2" dy="2" result="offsetBlur" />
                            <feSpecularLighting in="blur" surfaceScale="5" specularConstant="1" specularExponent="20"
                                lighting-color="#fff" result="spec">
                                <fePointLight x="-5000" y="-10000" z="20000" />
                            </feSpecularLighting>
                            <feComposite in="spec" in2="SourceAlpha" operator="in" result="specOut" />
                            <feComposite in="SourceGraphic" in2="specOut" operator="over" result="main" />
                            <feBlend in="main" in2="offsetBlur" mode="normal" />
                        </filter>
                    </defs>
                </svg>
            </section>

            <div id="details-popup" class="details-popup">
                <div class="popup-header">
                    <h3 id="txt-details-title" class="popup-title">Details</h3>
                    <button id="popup-close" class="close-btn">&times;</button>
                </div>
                <div id="popup-body" class="popup-body"></div>
            </div>
        </main>
    </div>
    <script src="static/js/script.js"></script>
</body>

</html>
